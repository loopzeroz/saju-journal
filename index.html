function renderScenario(id){const s=data.hour.scenarios.find(x=>x.id===id);document.getElementById('scenario').innerHTML=`<p class="eyebrow">${esc(s.label)}</p><strong>${esc(s.korean)} <span lang="zh">${esc(s.hanja)}</span></strong><p>${esc(s.text)}</p>`;}
